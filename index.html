*{box-sizing:border-box}
html,body{overflow-x:hidden}
:root[data-theme="dark"]{
  --navy:#1E4A70; --bg:#0B1722; --surface:#12263A; --surface-2:#183049; --zebra:#152B40; --ink:#E9EFF5; --muted:#A3B4C4;
  --line:rgba(237,221,172,.18); --rust:#C47A4F; --rust-text:#E3A987; --good:#2F7D3F; --bad:#E3A987; --badbg:#183049;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.6); --lift:0 2px 4px rgba(0,0,0,.4),0 14px 28px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="dark"] .mast .mtop b{color:var(--ink)}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlerow h1{flex:1;min-width:0}
.tbtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;min-height:40px;min-width:76px;font-size:13px;font-weight:700;color:var(--ink)}
.tbtn:hover{border-color:var(--rust)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#102E47;z-index:50;pointer-events:none}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
header.top{padding-block:20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:12px}
.brand b{color:var(--rust-text)}
.logo{display:block;height:64px;width:auto}
.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
.sub{font-size:12px;color:var(--muted)}
h1{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:30px;line-height:1.05;margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:46ch}
.label{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--rust-text)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;min-height:72px;width:100%}
.deck:hover{border-color:var(--rust)}
.deck .name{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:16px}
.deck .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;align-self:center}
.deck .desc{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.bar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}
.bar .l{background:var(--rust)}
/* read */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px;background:var(--line);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.rs{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.rs h2{margin:0 0 8px;font-family:var(--font-menu);font-size:17px;line-height:1.35;text-wrap:balance}
.rrow{padding-block:9px;border-top:1px solid var(--line);display:grid;gap:2px}
.rrow dt{margin:0}
.rrow dd{margin:0;font-family:var(--font-menu);font-size:14.5px;line-height:1.6}
/* study */
.studyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.back{border:0;background:none;font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rust);transition:width .26s cubic-bezier(.22,.8,.3,1)}
.card{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px 16px;min-height:400px;box-shadow:0 6px 0 -2px var(--line)}
.card .cat{align-self:flex-start}
.card .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:20px}
.card .front{align-items:center;text-align:center}
.front h2{font-family:var(--font-menu);font-weight:700;font-size:23px;line-height:1.4;margin:0;text-wrap:balance}
.tap{align-self:center;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sec{padding-block:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.sec .label{display:block;margin-bottom:4px}
.sec .txt{font-family:var(--font-menu);font-size:15.5px;line-height:1.6}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;border-radius:10px;min-height:52px;font-weight:800;font-size:14px;letter-spacing:.04em;padding:12px}
.btn.learn{background:var(--rust);color:var(--on-rust)}
.btn.got{background:var(--good);color:var(--on-good)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink)}
.btn.wide{grid-column:1/-1}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.nav button{border:0;background:none;font-size:13px;font-weight:600;color:var(--muted);padding:10px 6px;min-height:44px}
.done{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:26px 20px}
.done h2{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.04em;font-size:26px;margin:4px 0 8px}
.done .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.done .row .btn{flex:1 1 150px}
/* quiz */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px}
.q h2{font-family:var(--font-menu);font-size:18px;line-height:1.45;margin:6px 0 16px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;min-height:50px;font-size:14.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--rust)}
.opt.ok{background:var(--good);color:var(--on-good);border-color:var(--good)}
.opt.no{border-color:var(--bad);color:var(--bad);border-style:dashed}
.opt:disabled{cursor:default}
.fb{margin:12px 0 0;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line)}
.fb.wrong{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:11px;margin-bottom:3px}
.fb.wrong b{color:var(--bad)}
.fb.right b{color:var(--rust-text)}
.fb span{display:block;margin-top:6px;color:var(--muted)}
.missed{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.missed li{font-size:13.5px;border-top:1px solid var(--line);padding-top:10px}
.missed b{display:block;font-family:var(--font-menu);font-weight:700}
.viewer{overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;max-height:78vh}
.doc p{font-family:var(--font-menu);font-size:14.5px;line-height:1.65;margin:0 0 10px}
.doc .dsub{font-family:var(--font-body);color:var(--muted);font-size:13px}
.doc .dq{border-left:3px solid var(--rust);padding-left:12px}
.doc .dh{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.05em;font-size:22px;margin:30px 0 8px;padding-top:18px;border-top:1.5px solid var(--line);text-wrap:balance}
.doc .dl{margin:18px 0 6px;font-size:12px}
.doc .dk{display:inline-block;margin-right:4px}
a{color:var(--rust-text)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.reset{margin-top:26px;text-align:center}
.reset button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:10px;min-height:44px}
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Brand Hub look */
body{background:var(--bg)}
header.top{border-bottom:3px solid var(--navy);margin-bottom:18px;padding-block:18px 12px}
.brand{font-weight:600;letter-spacing:.32em}
h1,.label,.deck .name,.done h2,.doc .dh,.fb b{font-weight:600}
h1{letter-spacing:.08em}
.deck,.rs,.q,.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.deck{transition:transform .22s cubic-bezier(.22,.8,.3,1),box-shadow .22s cubic-bezier(.22,.8,.3,1),border-color .22s}
.deck:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:var(--line)}
.deck .name{letter-spacing:.08em}
.chip{background:var(--surface);border:1.5px solid var(--rust);color:var(--rust-text);font-weight:700}
.chip[aria-pressed="true"]{background:var(--rust);color:#fff;border-color:var(--rust)}
.rrow:nth-of-type(even){background:var(--zebra);border-radius:8px;padding-inline:8px;border-top-color:transparent}
.prog,.bar{background:var(--surface-2)}
.prog i{background:var(--good)}
.bar .g{background:var(--good)}
.bar .l{background:var(--rust)}
.btn{border-radius:999px;font-weight:700;box-shadow:0 1px 2px rgba(16,46,71,.08),0 3px 8px -4px rgba(178,105,65,.45);transition:transform .22s cubic-bezier(.22,.8,.3,1),box-shadow .22s cubic-bezier(.22,.8,.3,1),background .22s,color .22s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.learn,.btn.ghost{background:var(--surface);border:1.5px solid var(--rust);color:var(--rust-text)}
.btn.learn:hover,.btn.ghost:hover{background:var(--rust);color:#fff}
.btn.learn.wide,.done .row .btn.learn{background:var(--rust);color:#fff}
.btn.got{background:var(--good);color:#fff}
.card{background:var(--navy);color:var(--tan);border:0;border-radius:16px;box-shadow:var(--lift);position:relative;overflow:hidden;isolation:isolate}
.card .label{color:var(--tan);opacity:.8}
.card .sec{border-top-color:rgba(237,221,172,.22)}
.card .tap{color:var(--tan);opacity:.7}
.card.ff::before{content:"";position:absolute;right:-44px;bottom:-64px;width:300px;height:257px;background:var(--mark88) center / contain no-repeat;opacity:.35;pointer-events:none;z-index:-1}
.opt{background:var(--surface);border-radius:12px}
.opt.ok{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{background:var(--surface);border:1.5px dashed var(--rust);color:var(--rust-text)}
.fb{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--good)}
.fb.wrong{background:var(--surface-2);border-color:var(--line);border-left:4px solid var(--rust)}
.fb.wrong b{color:var(--rust-text)}
.fb.right b{color:var(--good)}
.doc .dh{border-top:2px solid var(--navy)}
.deck .name{justify-self:start;align-self:center;line-height:1.05;padding-bottom:1px;border-bottom:1.5px solid var(--rust)}
/* home: five tall boxes that fill the screen */
.list.home{grid-auto-rows:1fr;min-height:max(540px,calc(100vh - 380px));min-height:max(540px,calc(100dvh - 380px))}
.mast{background:none;border:0;box-shadow:none;border-radius:0;padding:2px 2px 0;margin:0 0 14px}
.mast .mtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mast .mtop b{font-family:'Libre Baskerville',Georgia,serif;font-size:22px;color:var(--navy)}
.mast .mbar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.mast .mbar i{display:block;height:100%;background:var(--rust);border-radius:5px;transition:width .26s cubic-bezier(.22,.8,.3,1)}
.mast .mbar{position:relative}
.mast .mbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);margin-left:-1px}
.mast .tiers{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mast .tiers span:nth-child(2){padding-left:0}
.mast .tiers span:nth-child(3){text-align:right;white-space:nowrap;margin-right:0;justify-self:end}
.mast .tiers span.on{color:var(--rust-text);font-weight:700}
.mast .msub{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.list.home .deck{align-content:center;min-height:108px;padding:20px 20px;row-gap:6px}
.list.home .deck .name{font-size:21px}
.list.home .deck .desc{font-size:13.5px}
.list.home .deck .meta{font-size:12.5px}
.list.quizl{min-height:max(600px,calc(100vh - 340px));min-height:max(600px,calc(100dvh - 340px))}
.list.quizl .deck .name{font-size:19px}
@media (prefers-reduced-motion:reduce){.deck:hover,.btn:hover{transform:none}}
</style>
</head>

 {id:"pamphlet",name:"Catering Call Pamphlet",type:"Document",desc:"The full call script: five beats, intro, discovery, value, objections, good to know",url:"https://docs.google.com/document/d/1ZwcEzqafJOsdHXpiNNgkGDaUof9KC2O4HdiCrepEC1s",text:"Draft for review · October 13, 2026\n# Before you dial\nRead this page before every call block. Then memorize the five beats, and the rest follows.\n## The call in five beats\n@1. Intro|Introduce you and your role, and check they know Kitchen88.\n@2. Ask|Ask a few questions to learn what they need.\n@3. Value|Explain how you make their lunches easy, at a discounted price.\n@4. Show|Guide caller to Kitchen88 Website to set up and order.\n@5. Close|End on a good note. (Closed order, Quote Emailed, Contact info/follow up scheduled)\n## The offer\n@Buffet|$24 per person. Group size 25 or more. 2 proteins, 2 sides, House Salad, rolls, 2 sauces. Plates, napkins, silverware, serving ware included. On the phone: quote it.\n@À La Carte (push this one)|Built together on the site. Any size. They choose proteins, sides, salads, and rolls. Full pan serves 25, half pan serves 15. On the phone: build it, don’t quote it.\n## The menu\n@Proteins|Tri Tip Steak, Grilled Chicken, Pork Tenderloin.\n@Sides|Mashed Potatoes, Mushroom Risotto, Rice Pilaf, Asparagus, Broccolini.\n@Salads (À La Carte)|House Salad, Beet & Squash, Cobb, Mango & Black Bean, Apple & Manchego.\n@Rolls|Included with Buffet, available À La Carte.\n## Your rules\n@Quotes|Quotes always include Buffet. Add additional À La Carte quote if you feel necessary (with a note clarifying it’s custom).\n@Language|Stick to the brand voice. Always friendly.\n@Messaging|Ask permission before sending any further information.\n## Where you send them\n@Page|kitcheneightyeight.com/catering\n@Button|They click “Start my order” to build it.\n# 1. Intro\nGoal: get permission to ask questions in under 30 seconds.\n## Opening line, every time\n> “Hey how’s it going? This is Tyler, the Catering Manager with Kitchen88, I’m looking to get in contact with whoever takes care of lunches and events to see if I can help out.”\n## Opener\n> “Hi [Name], it’s [Your name] with Kitchen88. I’m the catering manager. I’m sure you’ve heard of us before?”\n@Yes|“Great, then you know we pride ourselves with clean ingredients, premium proteins, and overall high quality food.”\n@No|“No worries. We’ve been around over a decade, we have three locations across Utah. Clean ingredients, premium proteins, and overall high quality food.”\n## Transition into discovery\n> “What kind of things are you and your team doing for lunch currently? Are you guys going out together, or catering?”\n## Voicemail (20 seconds)\n> “Hi [Name], it’s [Your name], catering manager at Kitchen88. I was just reaching out to help make your next event a little bit easier. I’ve got a catering offer to run by whoever takes care of it. I’ll try you again [day]. You can reach me at [your number]. Thanks.”\n# 2. Discovery\nQuestions only. Ask the core three every call, add one or two from the bank, and skip anything they’ve already answered. Listen, then react to what they say before the next question.\n## Core three (every call)\n@1|“When you cater, is it usually for team lunches, big events, or maybe mix of both?”\n@2|“About how often?”\n@3|“And how many people are you trying to feed usually?”\n## What matters\n> “Besides price, what matters most when you pick a caterer: quality, variety, reliability, or easy ordering?”\n> “What’s one thing you wish was easier about catering?”\n> “What have people on your team said they liked, or didn’t?”\n## Situation\n> “Where does lunch come from when you have a long meeting?”\n> “Who usually handles ordering for the team?”\n> “When’s the last time you brought food in? How did it go?”\n## Size and timing\n> “Is that a regular thing or more once in a while?”\n> “Any events or meetings on the calendar this month?”\n> “When would you want to have something set up by?”\n## Budget (ask while they’re on the site)\n> “Do you have a per-person range you try to stay in?”\n> “Does that range feel right for what you’re looking at?”\n## Decision\n> “Who else weighs in on a decision like this?”\n> “What would you need to see to feel good about trying us?”\n> “If I put together a quote, who should I send it to?”\n## Logistics\n> “Is it delivered to your office, or would someone pick it up?”\n> “What time do you need it there?”\n> “Any dietary needs I should plan around?”\n## Checklist before you close\nHeadcount · Frequency · Event type · Date · Delivery or pickup, and address · Dietary needs · Budget and who approves\n# 3. Value\nGoal: connect what they told you to what you can do for them, at a discounted price. Tie it to what you heard in discovery: headcount, how often, and what matters to them.\n## Value line\n> “My job is pretty simple: I make company lunches, meetings, and events easy, with food people actually look forward to. If I can help you out with your next lunch or event, I can get it done at a discounted price.”\n## Then show\n@Show|Guide them to kitcheneightyeight.com/catering and build the order together. Then close.\n@If they object early|Answer with the overcome for that objection. You can bring the discounted price forward if it helps keep them on the call.\n# 4. Objections and overcomes\nEvery answer has three beats: Acknowledge in a few words, Reframe with one specific, Bridge back to a question or the next step. Never argue, never knock another caterer.\n## “We already have a caterer.”\n@Acknowledge|“For sure, sounds like you’re pretty on top of it.”\n@Reframe|“Plenty of teams keep their regular spot and add us for the lunches on occasion when they want a step above.”\n@Bridge|“I understand you’ve got things pretty locked down on your end but if there’s an event I can help make easier with my service, we can walk through setting it up right now.”\n@If yes|Transition to website order setup and close.\n@If no|“K no worries. Just so I can tell my boss I gave you the proper information, what’s a good email I can send over some numbers and a discount code to?” {wait for answer} “And how many people would you say you normally feed so I can give you accurate numbers?”\n## “It’s too expensive.” / “Not in the budget.”\n@Acknowledge|“I totally understand.”\n@Reframe|“The beautiful thing about our catering, with the variety we offer, we can build the order around your number: you pick exactly what you need.”\n@Bridge|“If you just go to the Kitchen88 website with me, I can walk you through order setup to see if this makes sense for ya.”\n@If yes|Transition to website.\n@If no|“K no worries, to give you a realistic idea, how many people would you normally feed? What is a good email to send this to?”\n## “Just send me an email.”\n@Acknowledge|“Happy to.”\n@Reframe|“To make this easiest for you moving forward, I’d love to send you some numbers specifically for your team.”\n@Bridge|“How many people? Are you looking to stick to a budget?” {listen} “Cool. What is a good email I can send this over to? And a good phone number to keep in touch?”\n## “I’m not the decision-maker.”\n@Acknowledge|“No worries, that’s super helpful to know.”\n@Reframe|“I’m not going to sit here and waste your time.”\n@Bridge|“Who handles lunches or events?” {listen} “Cool, what’s the best time I could catch them?”\n## “We don’t really order catering.”\n@Acknowledge|“Ok cool, most people I talk to aren’t regularly catering.”\n@Reframe|“What do you guys usually do for lunches?”\n@Bridge|“Awesome, the great thing about our service, it just makes group lunches a lot easier on your end. It’s a quick setup through our website that I can help walk you through right now, then I take care of the rest. Are you by your computer?”\n## “Bad timing.” / “I’m busy.”\n@Acknowledge|“Totally fine. I’ll be quick.”\n@Reframe|“Two questions and I’ll let you go.”\n@Bridge|“How many people do you usually feed, and how often?”\n@If they refuse|“When’s a better time to call back?”\n@If they cooperate|“Awesome, my job is just to get you good information at a good price. What’s a good email I could send some numbers and a discount code?”\n## “I need to check with my team.”\n@Acknowledge|“Makes sense.”\n@Reframe|“I can send over some more concrete information to show them right now.”\n@Bridge|“What would they need to know to say yes: a menu, or pricing?”\n@Then|{transition to build a quote and get contact info}\n## “We’ve tried you before and it wasn’t great.”\n@Acknowledge|“I’m sorry about that, I’d want to hear what happened.”\n@Reframe|(Listen. Don’t defend.) “I’ve worked with this restaurant for over 5 years and that’s not the standard we hold ourselves to.”\n@Bridge|“I’ve stepped into this role as catering manager just recently and I take pride in making sure the quality is up to our standard. I’ll tell you what, if you’re willing to give us another chance, I’ll be able to take 10% off your next order. How’s that sound?”\n@If yes|“Awesome, are there any upcoming lunches or events I can help make easier for you?” {transition to website}\n@If no|Sales dead.\n## “We have dietary restrictions or allergies.”\n@Acknowledge|“Good thing to bring up.”\n@Reframe|“There are a couple items on the menu that I would warn you about but the majority of our catering options are very safe, what allergies and restrictions are you worried about?” {elaborate on dietary info for items that they are worried about}\n@Bridge|“Given those restrictions, if you wanna just go to our website we can set up an order ya.”\n@If yes|{website transition}\n@If no|“I totally understand your hesitance. What would be a good email that I could send over dietary info and potential numbers to?”\n## “Is there a minimum?” / “Is it too big for us?”\n@Acknowledge|“Good question.”\n@Reframe|“There isn’t with our À La Carte menu. We have the flexibility for you to order one half pan of meat, or enough food to feed hundreds. But we do have a standardized buffet offer that’s made for groups of 25 and above to make it easy for those groups.”\n@Bridge|“How many are you usually feeding? I’ll point you to the option that fits if you wanna just head to our website.”\n## “Will it be enough food?”\n@Acknowledge|“Good question. Nobody wants to run short, right?”\n@Reframe|“Each plate will end up having a bit of each protein you pick, a good amount of the side options which very easily fills up everybody’s plates.”\n@Bridge|“The beauty of our flexible À La Carte menu, just add a half pan of protein and you’re covered. How many people, and is it a hungry crowd?”\n## “How much notice do you need?”\n@Acknowledge|“Fair question.”\n@Reframe|“It’ll depend on the group size but we can usually get you taken care of with 24 hour notice at the latest.”\n@Bridge|“When’s your next event? If it’s inside the window, call me and I’ll see what we can do.”\n## “We’re last minute.”\n@Acknowledge|“No worries.”\n@Reframe|“Depending on your group size, we can get it done for you with a 24 hour notice.”\n@Bridge|“If there’s something I can help you with in the next couple days, head to the website right now and I’ll walk you through setting up the order.”\n## “Do you deliver?”\n@Acknowledge|“We absolutely do.”\n@Reframe|“If you prefer, you are always welcome to come pick it up, but it looks like you guys are about {minutes} from our {closest location} store so there is no issue with delivery.”\n@Bridge|“I can walk you through the order process right now and lock down time frames at the end.”\n## “Is this a sales call?” / “How did you get my number?”\n@Acknowledge|“Fair question. To shoot you straight, it absolutely is. I’m with Kitchen88 catering.”\n@Reframe|“I’m not here to pressure you into anything, I’m just calling to give you the information on what we do and offer you a deal on our catering.”\n@Bridge|“Do you ever bring in lunch for your team?”\n@If they say no thanks|“Understood. Have a good one.” (Respect the no and log it.)\n## The “No Pressure” close (use when they say they get a lot of sales calls)\n> “Look, I’m sure you get a lot of sales calls. They get pretty annoying, and they ask for these long-term commitments. The nice thing about what I’m doing is I’m just here to offer a great lunch at a great price, one time and make it as easy and as memorable as possible. If that’s something that interests you, we can set something up. Then after this one event, if you’re satisfied with our service, we can talk about being a regular catering service for you guys. If you want to just head to the website with me, see what the order process looks like, and get your setup for your event, how’s that sound?”\n## The wrap (every call)\n> “Perfect. You’ve got my direct line. When something comes up, call me and I’ll handle the menu, quantities, and ordering so you don’t have to figure it out yourself.”\n# Good to know\n## Portion note\n> “Picture a full dinner plate. Ours comes to about 18 ounces of food a plate: protein, sides, salad, and rolls. And if you’re worried about running short, you can add a half pan of protein to cover it.”\nSay it once, then move on. Talk only about our own plate, with no comparisons to other restaurants. The 18 ounce figure matches the Buffet plate. For À La Carte it depends on what they order, so check before quoting it there.\n## Stay inside the Brand Standard\nSay “seed oil free options” and name the item. Never “no seed oils” or “everything is seed-oil-free.” Say “many gluten free options,” never a “gluten free menu.”\nNever imply fried food is healthy. Describe ingredients and technique, not health outcomes. Guests with allergies should always tell the team when ordering. Peanut oil is used in the fryers. Avoid “delicious,” “amazing,” “best ever,” “last chance,” and any knock on another caterer.\n## Not on the catering page (confirm before promising)\nÀ la carte pan prices · Names of the two Buffet sauces · Order lead time and cutoff · Delivery radius and setup details · Dietary and allergy information · A same-day perk, and what makes a quote deadline real\n## After every call\nLog it in the shared sheet: outcome (A, B, C, or no answer), which objection came up, and the follow-up date.\nSend the quote or link the same day if you promised it.\nCheck the sheet before your next call block so you don’t double up with the Catering Director’s outreach.\n## Contact on the catering page\nThe form asks for name, email, phone, location, guest count, date, and full service (yes or no). Info line: info@kitcheneightyeight.com.\n"}
];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function stats(){var g=0,l=0;CARDS.forEach(function(c){if(prog[c.id]==="got")g++;else if(prog[c.id]==="learn")l++;});return{g:g,l:l,n:CARDS.length};}
function mastery(){
  var s=stats(),parts=[{n:"Flash cards",p:s.g/s.n,on:s.g+s.l>0}];
  QUIZZES.forEach(function(z){var b=best[z.id];parts.push({n:z.name.replace(/ quiz$/,""),p:b!=null?b/z.n:0,on:b!=null});});
  var tot=0,started=0;parts.forEach(function(x){tot+=x.p;if(x.on)started++;});
  var pct=Math.round(tot/parts.length*100);return{pct:pct,tier:pct>=90?2:pct>=60?1:0,started:started,total:parts.length};
}

/* one swipe animation used everywhere: old content slides out, new content slides in */
var navBusy=false,SWIPE=36,T_OUT=170,T_IN=260,E_OUT="cubic-bezier(.4,0,1,1)",E_IN="cubic-bezier(.22,.8,.3,1)";
function nav(dir,fn,sel,keepScroll){
  var el=document.querySelector(sel||"#main"),reduce=false;
  try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  function swap(){fn();render();if(!keepScroll)window.scrollTo(0,0);}
  if(!el||!el.animate||reduce){swap();return;}
  if(navBusy)return;
  navBusy=true;
  var out=el.animate([{transform:"translateX(0)",opacity:1},{transform:"translateX("+(-dir*SWIPE)+"px)",opacity:0}],{duration:T_OUT,easing:E_OUT,fill:"forwards"});
  out.onfinish=function(){
    swap();navBusy=false;
    var el2=document.querySelector(sel||"#main");
    if(el2)el2.animate([{transform:"translateX("+(dir*SWIPE)+"px)",opacity:0},{transform:"translateX(0)",opacity:1}],{duration:T_IN,easing:E_IN});
    out.cancel();
  };
}

  h+='<div class="prog"><i style="width:'+((S.q.i+(p>=0?1:0))/N*100)+'%"></i></div><div class="q"><span class="label">'+esc(curQuiz().name)+'</span><h2>'+esc(q.q)+'</h2>';
  S.q.opts.forEach(function(o,k){
    var cls="",dis=p>=0?" disabled":"";
    if(p>=0){if(o[0]===q.c)cls=" ok";else if(k===p)cls=" no";}
    h+='<button class="opt'+cls+'" data-act="pick" data-k="'+k+'"'+dis+'>'+esc(o[0])+'</button>';
  });
  if(p>=0){
    var o=S.q.opts[p];
    if(o[0]===q.c){h+='<div class="fb right"><b>Correct</b>'+(q.n?esc(q.n):'That’s the line.')+'</div>';}
    else{
      var why=o[1]||("That isn’t it. "+q.n);
      h+='<div class="fb wrong"><b>Why that’s wrong</b>'+esc(why)+'<span>Right answer: '+esc(q.c)+'</span></div>';
    }
    h+='<div class="grade"><button class="btn learn wide" data-act="qnext">'+(S.q.i===N-1?"See results":"Next question")+'</button></div>';
  }
  return h+'</div>';
}
function quizRes(){
  var N=S.q.list.length;
  var h='<div class="done"><span class="label">'+esc(curQuiz().name)+'</span><h2>'+S.q.score+' / '+N+'</h2>';
  if(S.q.missed.length){
    h+='<p class="lede" style="margin:0">Review these:</p><ul class="missed">';
    S.q.missed.forEach(function(q){h+='<li><b>'+esc(q.q)+'</b>'+esc(q.c)+'</li>';});
    h+='</ul>';
  }else h+='<p class="lede" style="margin:0">Clean round.</p>';
  return h+'<div class="row"><button class="btn learn" data-act="qstart" data-k="'+S.q.key+'">Play again</button><button class="btn ghost" data-act="qhome">Done</button></div></div>';
}

/* ================= EVENTS ================= */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a==="go"){var gv=b.getAttribute("data-v");nav((gv==="home"||S.asset)?-1:1,function(){S.tab=gv;S.view="home";S.q.view="home";S.asset=null;S.zoom=false;if(S.tab==="cards")startDeck();});}
  else if(a==="start"){nav(1,startDeck);}
  else if(a==="asset"){var ak=b.getAttribute("data-k");nav(1,function(){S.asset=ak;S.zoom=false;});}
  else if(a==="zoom"){S.zoom=!S.zoom;render();}
  else if(a==="shuffle"){S.shuffle=!S.shuffle;render();}
  else if(a==="hide"){S.hideDone=!S.hideDone;render();}
  else if(a==="home"){nav(-1,function(){S.view="home";S.tab="home";});}
  else if(a==="flip"){nav(S.flip?-1:1,function(){S.flip=!S.flip;},".card",true);}
  else if(a==="grade"){grade(b.getAttribute("data-v"));}
  else if(a==="prev"){if(S.i>0)nav(-1,function(){S.i--;S.flip=false;});}
  else if(a==="skip"){advance();}
  else if(a==="again"){nav(1,startDeck);}
  else if(a==="resetq"){b.textContent="Tap again to erase card progress";b.setAttribute("data-act","reset2");}
  else if(a==="theme"){var o={light:"dark",dark:"auto",auto:"light"};sSet("k88theme",o[themeMode()]);applyTheme();render();}
  else if(a==="reset2"){prog={};saveProg();render();}
  else if(a==="qstart"){qStart(b.getAttribute("data-k"));}
  else if(a==="qhome"){nav(-1,function(){S.q.view="home";});}
  else if(a==="pick"){var k=+b.getAttribute("data-k"),q=S.q.list[S.q.i];S.q.picked=k;
    if(S.q.opts[k][0]===q.c)S.q.score++;else S.q.missed.push(q);render();}
  else if(a==="qnext"){nav(1,function(){
    if(S.q.i===S.q.list.length-1){var z=curQuiz();if(best[z.id]==null||S.q.score>best[z.id]){best[z.id]=S.q.score;saveBest();}S.q.view="res";}
    else{S.q.i++;qOpts();}
  });}
});
document.addEventListener("keydown",function(e){
  if(S.tab!=="cards"||S.view!=="study")return;
  if(e.key===" "){e.preventDefault();nav(S.flip?-1:1,function(){S.flip=!S.flip;},".card",true);}
  else if(e.key==="ArrowRight"){advance();}
  else if(e.key==="ArrowLeft"&&S.i>0){nav(-1,function(){S.i--;S.flip=false;});}
  else if(S.flip&&(e.key==="1"||e.key==="2")){grade(e.key==="1"?"learn":"got");}
});
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
